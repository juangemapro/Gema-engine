name: Android APK

# Builds are intentionally manual-only during the 0.3 development phase.
# Run this workflow only when the project owner explicitly authorizes a build.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gema-engine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0-build-${{ github.run_number }}
          name: Gema Engine v0.3.0 build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          body: |
            Android debug build from the current main branch.
            Early engine development build; see README for verified capabilities and limits.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
